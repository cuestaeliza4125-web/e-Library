<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Library</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/icon.jpg">
<meta name="theme-color" content="#8B4513">
<script>
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js');
  }
</script>
</head>
<body>

<!-- ========== PAGE 1: LIBRARY ========== -->
<div id="library-page" class="page active">
  <div class="library-bg"></div>
  <div class="bg-overlay"></div>
  <h1 class="title">E-LIBRARY</h1>

  <!-- BOOKS -->
  <div class="book-container">
    <div class="book-item" data-book="emily">
      <img src="images/emily.jpg" alt="A Rose for Emily">
      <p>A Rose for Emily<br><span>by William Faulkner</span></p>
    </div>
    <div class="book-item" data-book="stars">
      <img src="images/stars.jpg" alt="The Dead Stars">
      <p>The Dead Stars<br><span>by Paz Marquez- Benitez</span></p>
    </div>
    <div class="book-item" data-book="hour">
      <img src="images/hour.jpg" alt="The Story of an Hour">
      <p>The Story of an Hour<br><span>by Kate Chopin</span></p>
    </div>
    <div class="book-item" data-book="magi">
      <img src="images/magi.jpg" alt="The Gift of Magi">
      <p>The Gift of Magi<br><span>by O. Henry</span></p>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls-wrapper">
    <div class="left-side">
      <button id="darkModeBtn">DARKMODE</button>
      <button id="fullscreenBtn">FULLSCREEN</button>
    </div>
    <div class="center-spacer"></div>
    <div class="right-side">
      <div class="controls-group">
        <div class="text-size">
          <button id="textDecrease">-</button>
          <button id="textIncrease">+</button>
        </div>
        <div class="voice-speed">
          <div class="voice-select">
            <button id="voiceIconBtn">
              <img src="images/voice PNG.jpg" alt="Voice">
            </button>
            <div id="voicePopup" class="voice-popup hidden">
              <h3>Select Voice</h3>
              <div class="voice-list">
                <button data-gender="female"><span class="gender-badge female">👩</span> Female</button>
                <button data-gender="male"><span class="gender-badge male">👨</span> Male</button>
              </div>
            </div>
          </div>
          <span id="currentVoiceIcon" class="gender-badge female">👩</span>
          <input type="range" id="speedSlider" min="0.5" max="1" step="0.25" value="1">
          <span id="speedValue">1x</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ========== PAGE 2: COVERS / POSTERS ========== -->

<!-- PAGE 2A: EMILY POSTER -->
<div id="emily-poster" class="page">
  <button class="back-btn">&lt;</button>
  <img src="images/emily-cover.jpg" class="poster-img" alt="A Rose for Emily">
  <button class="start-reading" data-book="emily">start reading</button>
</div>

<!-- PAGE 2B: STARS POSTER -->
<div id="stars-poster" class="page">
  <button class="back-btn">&lt;</button>
  <img src="images/stars-cover.jpg" class="poster-img" alt="The Dead Stars">
  <button class="start-reading" data-book="stars">start reading</button>
</div>

<!-- PAGE 2C: HOUR POSTER -->
<div id="hour-poster" class="page">
  <button class="back-btn">&lt;</button>
  <img src="images/hour-cover.jpg" class="poster-img" alt="The Story of an Hour">
  <button class="start-reading" data-book="hour">start reading</button>
</div>

<!-- PAGE 2D: MAGI POSTER -->
<div id="magi-poster" class="page">
  <button class="back-btn">&lt;</button>
  <img src="images/magi-cover.jpg" class="poster-img" alt="The Gift of the Magi">
  <button class="start-reading" data-book="magi">start reading</button>
</div>

<!-- ========== PAGE 3: READERS ========== -->

<!-- PAGE 3A: READER PAGE FOR EMILY -->
<div id="emily-reader" class="page">
 <div class="reader-header">
   <button class="back-btn reader-back" onclick="goHome()">&lt;</button>
   <h2>A Rose for Emily</h2>
   <div><button id="readAloudBtn">🔊 <span class="btn-text">Read Aloud</span></button></div> 
 </div>
 <div class="reader-content" id="readerTextEmily"></div>
 <div class="reader-footer">
   <div class="footer-left">
     <button id="decreaseFontBtnEmily">A-</button> 
     <button id="increaseFontBtnEmily">A+</button> 
   </div>
   <div class="footer-right">
     <button id="prevPageBtnEmily">← Prev</button>
     <button id="nextPageBtnEmily">Next →</button>
   </div>
 </div>
</div>

<!-- PAGE 3B: READER PAGE FOR STARS -->
<div id="stars-reader" class="page">
 <div class="reader-header">
   <button class="back-btn reader-back" onclick="goHome()">&lt;</button>
   <h2>The Dead Stars</h2>
   <div><button id="readAloudBtn">🔊 <span class="btn-text">Read Aloud</span></button></div> 
 </div>
 <div class="reader-content" id="readerTextStars"></div>
 <div class="reader-footer">
   <div class="footer-left">
     <button id="decreaseFontBtnStars">A-</button>
     <button id="increaseFontBtnStars">A+</button>
   </div>
   <div class="footer-right">
     <button id="prevPageBtnStars">← Prev</button>
     <button id="nextPageBtnStars">Next →</button>
   </div>
 </div>
</div>

<!-- PAGE 3C: READER PAGE FOR HOUR -->
<div id="hour-reader" class="page">
 <div class="reader-header">
   <button class="back-btn reader-back" onclick="goHome()">&lt;</button>
   <h2>The Story of an Hour</h2>
   <div><button id="readAloudBtn">🔊 <span class="btn-text">Read Aloud</span></button></div> 
 </div>
 <div class="reader-content" id="readerTextHour"></div>
 <div class="reader-footer">
   <div class="footer-left">
     <button id="decreaseFontBtnHour">A-</button>
     <button id="increaseFontBtnHour">A+</button>
   </div>
   <div class="footer-right">
     <button id="prevPageBtnHour">← Prev</button>
     <button id="nextPageBtnHour">Next →</button>
   </div>
 </div>
</div>

<!-- PAGE 3D: READER PAGE FOR MAGI -->
<div id="magi-reader" class="page">
 <div class="reader-header">
   <button class="back-btn reader-back" onclick="goHome()">&lt;</button>
   <h2>The Gift of the Magi</h2>
   <div><button id="readAloudBtn">🔊 <span class="btn-text">Read Aloud</span></button></div> 
 </div>
 <div class="reader-content" id="readerTextMagi"></div>
 <div class="reader-footer">
   <div class="footer-left">
     <button id="decreaseFontBtnMagi">A-</button>
     <button id="increaseFontBtnMagi">A+</button>
   </div>
   <div class="footer-right">
     <button id="prevPageBtnMagi">← Prev</button>
     <button id="nextPageBtnMagi">Next →</button>
   </div>
 </div>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
